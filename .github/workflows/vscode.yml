name: VS Code

on:
  pull_request:
    paths:
      - "extensions/vscode-brass-agent/**"
      - ".github/workflows/vscode.yml"
  push:
    branches: [main]
    paths:
      - "extensions/vscode-brass-agent/**"
      - ".github/workflows/vscode.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode-brass-agent/package-lock.json

      - run: npm ci --prefix extensions/vscode-brass-agent
      - run: npm run compile --prefix extensions/vscode-brass-agent

      - name: Package VS Code release candidate
        run: |
          mkdir -p artifacts/vscode
          npm run package:vsix --prefix extensions/vscode-brass-agent -- --out ../../artifacts/vscode/brass-agent.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: brass-agent-vscode
          path: artifacts/vscode/brass-agent.vsix
          if-no-files-found: error
