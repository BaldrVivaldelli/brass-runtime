name: Release

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install pinned nightly for fuzz targets
        if: matrix.node-version == 22
        run: rustup toolchain install nightly-2026-07-01 --profile minimal

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install cargo-fuzz
        if: matrix.node-version == 22
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - run: npm ci
      - run: npm run validate:boundaries
      - run: npm run validate:evidence
      - run: npm run validate:adoption-evidence
      - run: npm run validate:release-policy
      - run: npm run test:types
      - run: npm run rust:check
      - run: npm run native:build:debug
      - if: matrix.node-version == 22
        run: npm run rust:fuzz:check
      - run: npm run build
      - if: matrix.node-version == 22
        run: npm run validate:example:express
      - run: npm run validate:api
      - run: npm run validate:v2-map
      - run: npm run validate:wasm
      - run: npm run test:coverage
      - run: npm run validate:cjs
      - run: npm run validate:browser
      - run: npm run validate:package
      - run: npm run validate:products
      - if: matrix.node-version == 22
        run: npm run perf:runtime:budget
      - if: matrix.node-version == 22
        run: npm run benchmark:runtime:budget
      - if: matrix.node-version == 22
        run: npm run benchmark:runtime:primitives:budget
      - if: matrix.node-version == 22
        run: npm run benchmark:http:budget
      - if: matrix.node-version == 22
        run: npm run benchmark:observability:budget

      - name: Verify generated WASM files exist
        run: |
          ls -la wasm/pkg
          test -f wasm/pkg/brass_runtime_wasm_engine.js
          test -f wasm/pkg/brass_runtime_wasm_engine_bg.wasm
          test -f wasm/pkg/brass-runtime-build.json

  node18-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - run: npm ci
      - run: npm run validate:boundaries
      - run: npm run validate:evidence
      - run: npm run validate:adoption-evidence
      - run: npm run validate:release-policy
      - run: npm run rust:check
      - run: npm run native:build:debug
      - run: npm run build:wasm
      - run: npm run build
      - run: npm run validate:api
      - run: npm run validate:v2-map
      - run: npm run validate:wasm
      - run: npm run validate:cjs
      - run: npm run validate:browser
      - run: npm run validate:package
      - run: npm run validate:products

      - name: Verify generated WASM files exist
        run: |
          ls -la wasm/pkg
          test -f wasm/pkg/brass_runtime_wasm_engine.js
          test -f wasm/pkg/brass_runtime_wasm_engine_bg.wasm
          test -f wasm/pkg/brass-runtime-build.json

  native-artifacts:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.94.0

      - run: npm run native:build
      - run: npm run native:package
      - run: npm run release:artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: brass-native-service-${{ runner.os }}-${{ runner.arch }}
          path: |
            native/
            artifacts/release/
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, node18-smoke, native-artifacts]
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - run: npm ci
      - run: npm run validate:boundaries
      - run: npm run validate:evidence
      - run: npm run validate:adoption-evidence
      - run: npm run validate:release-policy
      - run: npm run rust:check
      - run: npm run build
      - run: npm run validate:api
      - run: npm run validate:v2-map
      - run: npm run validate:wasm
      - run: npm run validate:cjs
      - run: npm run validate:browser
      - run: npm run validate:package
      - run: npm run validate:products
      - run: npm run native:build
      - run: npm run native:package
      - name: Verify WASM files are packed
        run: |
          ls -la wasm/pkg
          test -f wasm/pkg/brass_runtime_wasm_engine.js
          test -f wasm/pkg/brass_runtime_wasm_engine_bg.wasm
          npm pack --json > pack.json
          cat pack.json
          tar -tf brass-runtime-*.tgz | grep "package/wasm/pkg/brass_runtime_wasm_engine.js"
          tar -tf brass-runtime-*.tgz | grep "package/wasm/pkg/brass_runtime_wasm_engine_bg.wasm"
          tar -tf brass-runtime-*.tgz | grep "package/wasm/pkg/brass-runtime-build.json"

      - run: npm run release:artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: brass-release-metadata
          path: artifacts/release/
          if-no-files-found: error

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          npx --yes
          --package semantic-release@25.0.9
          --package @semantic-release/git@10.0.1
          semantic-release
