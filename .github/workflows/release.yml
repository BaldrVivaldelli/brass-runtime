name: Release

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to execute
        required: true
        default: stable
        type: choice
        options:
          - stable
          - v2-beta
      version:
        description: Exact v2 beta version (ignored for stable releases)
        required: true
        default: 2.0.0-beta.0
        type: string
      publish:
        description: Confirm publication; false runs validation only
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install pinned nightly for fuzz targets
        if: matrix.node-version == 22
        run: rustup toolchain install nightly-2026-07-01 --profile minimal

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install cargo-fuzz
        if: matrix.node-version == 22
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - run: npm ci
      - run: npm run validate:boundaries
      - run: npm run validate:dependency-security
      - run: npm run validate:evidence
      - run: npm run validate:adoption-evidence
      - run: npm run validate:release-policy
      - run: npm run test:types
      - run: npm run rust:check
      - if: matrix.node-version == 22
        run: npm run rust:fuzz:check
      - run: npm run build
      - if: matrix.node-version == 22
        run: npm run validate:example:express
      - run: npm run validate:api
      - run: npm run validate:v2-map
      - run: npm run validate:wasm
      - run: npm run test:coverage
      - run: npm run validate:cjs
      - run: npm run validate:browser
      - run: npm run validate:package
      - run: npm run validate:products
      - if: matrix.node-version == 22
        run: npm run perf:runtime:budget
      - if: matrix.node-version == 22
        run: npm run benchmark:runtime:budget
      - if: matrix.node-version == 22
        run: npm run benchmark:runtime:primitives:budget
      - if: matrix.node-version == 22
        run: npm run benchmark:http:budget
      - if: matrix.node-version == 22
        run: npm run benchmark:observability:budget

      - name: Verify generated WASM files exist
        run: |
          ls -la wasm/pkg
          test -f wasm/pkg/brass_runtime_wasm_engine.js
          test -f wasm/pkg/brass_runtime_wasm_engine_bg.wasm
          test -f wasm/pkg/brass-runtime-build.json

  node20-compat-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - run: npm ci
      - run: npm run validate:boundaries
      - run: npm run validate:dependency-security
      - run: npm run validate:evidence
      - run: npm run validate:adoption-evidence
      - run: npm run validate:release-policy
      - run: npm run rust:check
      - run: npm run build:wasm
      - run: npm run build
      - run: npm run validate:api
      - run: npm run validate:v2-map
      - run: npm run validate:wasm
      - run: npm run validate:cjs
      - run: npm run validate:browser
      - run: npm run validate:package
      - run: npm run validate:products

      - name: Verify generated WASM files exist
        run: |
          ls -la wasm/pkg
          test -f wasm/pkg/brass_runtime_wasm_engine.js
          test -f wasm/pkg/brass_runtime_wasm_engine_bg.wasm
          test -f wasm/pkg/brass-runtime-build.json

  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.channel == 'stable' &&
          inputs.publish
        )
      )
    runs-on: ubuntu-latest
    needs: [test, node20-compat-smoke]
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - run: npm ci
      - run: npm run validate:boundaries
      - run: npm run validate:dependency-security
      - run: npm run validate:evidence
      - run: npm run validate:adoption-evidence
      - run: npm run validate:release-policy
      - run: npm run rust:check
      - run: npm run build
      - run: npm run validate:api
      - run: npm run validate:v2-map
      - run: npm run validate:wasm
      - run: npm run validate:cjs
      - run: npm run validate:browser
      - run: npm run validate:package
      - run: npm run validate:products
      - name: Verify the tarball does not embed the WASM engine
        run: |
          npm pack --json > pack.json
          cat pack.json
          # The engine installs separately as @brass/engine-wasm. If it shows up
          # inside this tarball again, the package shape has regressed.
          if tar -tf brass-runtime-*.tgz | grep -q "package/wasm/"; then
            echo "brass-runtime must not embed the WASM engine" >&2
            exit 1
          fi
          tar -tf brass-runtime-*.tgz | grep -q "package/dist/index.d.ts"
          tar -tf brass-runtime-*.tgz | grep -q "package/dist/v1/index.d.ts"

      - run: npm run release:artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: brass-release-metadata
          path: artifacts/release/
          if-no-files-found: error

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          npx --yes
          --package semantic-release@25.0.9
          --package @semantic-release/git@10.0.1
          semantic-release

  v2-beta:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/next' &&
      inputs.channel == 'v2-beta' &&
      inputs.publish
    needs: [test, node20-compat-smoke]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-v2-beta.yml
    with:
      version: ${{ inputs.version }}
      publish: true
