name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane. Everything here catches a regression a reviewer would otherwise
  # miss, and nothing here needs a Rust toolchain. Keep it under a few minutes.
  #
  # The declaration-contract gates are not here: they read dist/*.d.ts, and tsup
  # refuses to build without wasm/pkg. `public-api-snapshot.test.ts` runs in
  # test:coverage and fingerprints the runtime export surface, which is the
  # PR-level guard against an unintended public API change.
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run validate:boundaries
      - run: npm run validate:dependency-security
      - run: npm run test:types
      - run: npm run test:coverage

  # Packaging and cross-condition validation. This needs the WASM toolchain, so
  # it runs on main rather than on every push to a pull request. The release
  # workflow re-runs all of it plus the evidence and budget gates.
  package:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - run: npm ci
      - run: npm run rust:check
      - run: npm run build
      - run: npm run validate:wasm
      - run: npm run validate:api
      - run: npm run validate:v2-map
      - run: npm run validate:example:express
      - run: npm run validate:cjs
      - run: npm run validate:browser
      - run: npm run validate:package
      - run: npm run validate:products
      - run: npm run benchmark:runtime:budget
