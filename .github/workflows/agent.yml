name: Agent

on:
  pull_request:
    paths:
      - "src/agent/**"
      - "src/core/**"
      - "packages/agent/**"
      - "scripts/check-product-boundaries.mjs"
      - "scripts/validate-product-packages.mjs"
      - "tsconfig.agent.json"
      - "tsup.config.ts"
      - "tsup.agent.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/agent.yml"
  push:
    branches: [main]
    paths:
      - "src/agent/**"
      - "src/core/**"
      - "packages/agent/**"
      - "scripts/check-product-boundaries.mjs"
      - "scripts/validate-product-packages.mjs"
      - "tsconfig.agent.json"
      - "tsup.config.ts"
      - "tsup.agent.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - run: npm ci
      - run: npm run validate:boundaries
      - run: npm run test:types:agent
      - run: npm run test:agent
      - run: npm run build
      - run: npm run validate:product:agent

      - name: Pack Agent release candidate
        run: |
          mkdir -p artifacts/agent
          npm pack --ignore-scripts --pack-destination artifacts/agent ./packages/agent

      - uses: actions/upload-artifact@v7
        with:
          name: brass-agent-package
          path: artifacts/agent/*.tgz
          if-no-files-found: error
