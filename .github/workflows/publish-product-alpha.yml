name: Publish Companion Product Alpha

on:
  workflow_dispatch:
    inputs:
      product:
        description: Independently versioned product to publish
        required: true
        type: choice
        options:
          - agent
          - perf
          - engine-wasm
      version:
        description: Exact alpha version already present in the product manifest
        required: true
        default: 0.1.0-alpha.0
        type: string
      publish:
        description: Publish the validated package to npm with the alpha tag
        required: true
        default: false
        type: boolean
      bootstrap:
        description: Use NPM_TOKEN for this package's first version only; otherwise require Trusted Publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-product-alpha-${{ inputs.product }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    environment: npm-products

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm with provenance support
        run: |
          npm install --global npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Resolve the selected product
        id: product
        env:
          PRODUCT: ${{ inputs.product }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          case "$PRODUCT" in
            agent) package_name="@brass/agent"; package_dir="./packages/agent" ;;
            perf) package_name="@brass/perf"; package_dir="./packages/perf" ;;
            engine-wasm) package_name="@brass/engine-wasm"; package_dir="./packages/engine-wasm" ;;
            *) echo "Unsupported product: $PRODUCT" >&2; exit 1 ;;
          esac
          actual_version="$(node -p "require('./$package_dir/package.json').version")"
          test "$actual_version" = "$REQUESTED_VERSION"
          case "$actual_version" in
            *-alpha.*) ;;
            *) echo "The independent prerelease channel accepts exact alpha versions only" >&2; exit 1 ;;
          esac
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"
          echo "version=$actual_version" >> "$GITHUB_OUTPUT"

      - name: Enforce the bootstrap or Trusted Publishing boundary
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          PACKAGE_NAME: ${{ steps.product.outputs.package_name }}
        shell: bash
        run: |
          package_exists=false
          registry_result=""
          if registry_result="$(npm view "$PACKAGE_NAME" name --json 2>&1)"; then
            package_exists=true
          elif ! grep -Eq 'E404|404 Not Found' <<<"$registry_result"; then
            echo "::error::Unable to determine registry state for $PACKAGE_NAME; refusing to select an authentication mode."
            exit 1
          fi
          if [ "$BOOTSTRAP" = "true" ] && [ "$package_exists" = "true" ]; then
            echo "::error::$PACKAGE_NAME already exists; disable bootstrap and use its npm Trusted Publisher."
            exit 1
          fi
          if [ "$BOOTSTRAP" != "true" ] && [ "$package_exists" = "false" ]; then
            echo "::error::$PACKAGE_NAME does not exist; its first version requires an explicitly approved bootstrap run."
            exit 1
          fi
          echo "Registry state for $PACKAGE_NAME is $([ "$package_exists" = "true" ] && echo existing || echo absent); authentication boundary accepted." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify npm bootstrap identity and @brass membership
        if: inputs.bootstrap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          npm_identity="$(npm whoami)"
          if ! npm org ls brass "@$npm_identity" --json >/dev/null; then
            echo "::error::NPM_TOKEN authenticates as $npm_identity but cannot read membership in the brass npm organization. Create or join the organization and grant the token organization read plus @brass package-scope publish access."
            exit 1
          fi
          echo "npm bootstrap identity $npm_identity can read @brass organization membership." >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - run: npm ci
      - run: npm run release:check

      - name: Validate the selected product
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          npm run "validate:product:$PRODUCT"

      - name: Dry-run the exact alpha publication
        env:
          PACKAGE_DIR: ${{ steps.product.outputs.package_dir }}
        run: npm publish "$PACKAGE_DIR" --ignore-scripts --dry-run --access public --tag alpha --json

      - name: Snapshot registry state and reject an existing version
        id: registry-before
        env:
          PACKAGE_NAME: ${{ steps.product.outputs.package_name }}
          PRODUCT_VERSION: ${{ steps.product.outputs.version }}
        shell: bash
        run: |
          stable_latest="$(npm view "$PACKAGE_NAME" dist-tags.latest 2>/dev/null || true)"
          prior_alpha="$(npm view "$PACKAGE_NAME" dist-tags.alpha 2>/dev/null || true)"
          if npm view "$PACKAGE_NAME@$PRODUCT_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PRODUCT_VERSION already exists; update the product manifest" >&2
            exit 1
          fi
          echo "stable_latest=$stable_latest" >> "$GITHUB_OUTPUT"
          echo "prior_alpha=$prior_alpha" >> "$GITHUB_OUTPUT"

      - name: Pack the reviewed product candidate
        env:
          PACKAGE_DIR: ${{ steps.product.outputs.package_dir }}
        run: |
          mkdir -p artifacts/products
          npm pack "$PACKAGE_DIR" --ignore-scripts --pack-destination artifacts/products

      - uses: actions/upload-artifact@v7
        with:
          name: brass-${{ inputs.product }}-${{ inputs.version }}
          path: artifacts/products/*.tgz
          if-no-files-found: error

      - name: Bootstrap the first alpha with the short-lived token
        if: inputs.bootstrap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_DIR: ${{ steps.product.outputs.package_dir }}
        run: npm publish "$PACKAGE_DIR" --ignore-scripts --access public --tag alpha --provenance

      - name: Publish alpha with npm Trusted Publishing
        if: ${{ !inputs.bootstrap }}
        env:
          PACKAGE_DIR: ${{ steps.product.outputs.package_dir }}
        run: npm publish "$PACKAGE_DIR" --ignore-scripts --access public --tag alpha --provenance

      - name: Verify alpha changed and latest did not
        env:
          PACKAGE_NAME: ${{ steps.product.outputs.package_name }}
          PRODUCT_VERSION: ${{ steps.product.outputs.version }}
          STABLE_LATEST_BEFORE: ${{ steps.registry-before.outputs.stable_latest }}
        shell: bash
        run: |
          current_alpha=""
          for attempt in {1..20}; do
            current_alpha="$(npm view "$PACKAGE_NAME" dist-tags.alpha 2>/dev/null || true)"
            if [ "$current_alpha" = "$PRODUCT_VERSION" ]; then
              break
            fi
            echo "Waiting for npm registry propagation ($attempt/20)..."
            sleep 15
          done
          current_latest="$(npm view "$PACKAGE_NAME" dist-tags.latest 2>/dev/null || true)"
          test "$current_alpha" = "$PRODUCT_VERSION"
          test "$current_latest" = "$STABLE_LATEST_BEFORE"
          echo "Published $PACKAGE_NAME@$PRODUCT_VERSION on alpha; latest remains unchanged." >> "$GITHUB_STEP_SUMMARY"
