version: 2
updates:
  # npm (TypeScript/Node del proyecto)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    # Evita ruido por majors (igual te llegarán PRs de seguridad si aplica)
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    # Agrupa cambios típicos de tooling para que salgan en un solo PR
    groups:
      patches:
        update-types: ["patch"]
      minors:
        update-types: ["minor"]
      lint-test-ts:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "@types/*"
          - "typescript"
          - "vitest*"
          - "vite*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/examples/angular"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:10"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(angular)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      angular-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/examples/nestjs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(nestjs)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nestjs-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/examples/nextjs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:20"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(nextjs)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nextjs-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/examples/react"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:25"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(react-example)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      react-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/extensions/vscode-brass-agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(vscode)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      vscode-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions (archivos en .github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Argentina/Buenos_Aires"
    commit-message:
      prefix: "deps(actions)"
    groups:
      gha-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker Compose (para la imagen/es del entorno spark-server)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Argentina/Buenos_Aires"
    commit-message:
      prefix: "deps(compose)"
    groups:
      compose-minor-patch:
        update-types: ["minor", "patch"]
